<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Embed — Mini CDN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
    .stat-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 20px; text-align: center;
    }
    .stat-value { font-size: 2.5rem; font-weight: 800; color: #3b82f6; }
    .stat-label { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .status-ok { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status-down { background: rgba(239,68,68,0.15); color: #ef4444; }
    #output { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-family: monospace; white-space: pre-wrap; min-height: 120px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>📊 Quick Stats</h1>
  <p>This page fetches live stats from the CDN router. Open your browser console to see raw responses.</p>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="s-total">—</div>
      <div class="stat-label">Total Requests</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="s-hits">—</div>
      <div class="stat-label">Cache Hits</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="s-misses">—</div>
      <div class="stat-label">Cache Misses</div>
    </div>
  </div>

  <button onclick="loadStats()">🔄 Refresh Stats</button>
  <div id="output">Click "Refresh Stats" to load...</div>

  <p><a href="index.html">← Back to Home</a></p>

  <script>
    async function loadStats() {
      const out = document.getElementById('output');
      try {
        const res = await fetch('http://127.0.0.1:9000/stats');
        const data = await res.json();
        console.log('CDN Stats:', data);
        out.textContent = JSON.stringify(data, null, 2);

        let totalHits = 0, totalMisses = 0;
        const edges = data.edge_stats || {};
        for (const id in edges) {
          totalHits += edges[id].cache_hits || 0;
          totalMisses += edges[id].cache_misses || 0;
        }
        document.getElementById('s-total').textContent = data.total_requests || 0;
        document.getElementById('s-hits').textContent = totalHits;
        document.getElementById('s-misses').textContent = totalMisses;
      } catch (e) {
        out.textContent = 'Error fetching stats: ' + e.message;
      }
    }
    loadStats();
  </script>
</body>
</html>
